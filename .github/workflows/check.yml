name: scorekeeper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scorekeeper
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - run: |
          git config user.name "scorekeeper"
          git config user.email "scorekeeper@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "score: $(date -u +%H:%MZ)"
          git push
